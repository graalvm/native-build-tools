      - focused validation outcomes, blockers, and disclosed gaps
      - paths to the full issue, rules, spec-fit, implementation, and validation
        artifacts for reviewers that need specialist evidence
      - no review conclusions or publication-readiness judgment

      The stable review brief is the latest cycle's packet; the visit file is a
      durable per-cycle record. Rewrite the stable brief from current evidence
      on every visit so repaired findings do not leave stale context behind.
    outputs:
