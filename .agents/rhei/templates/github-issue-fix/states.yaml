      `{output.review-brief-visit.path}` as a compact evidence packet for the
      focused reviewers. Keep it under 800 words and summarize rather than copy
      the source artifacts. Include:
      - the approved proposal ID and whether approval was GitHub-authorized or
        the `no-pr` local human gate
