        mode's explicit `model_reasoning_effort` configuration in the rendered
        `.agents/rhei/settings.json`. If that execution evidence does not expose
        an effort, write `not reported`; do not infer it from the model name or
        a current ambient configuration. Do not expose the agent execution mode.
      - Counted review and validation visits must be distinct entries labeled
        with their cycle number. Include `address-review` entries when the
        workflow repaired findings. If `runtime/state-transitions.log` shows a
        human gate, include it in execution order with `Tokens: not applicable`.
        Summarize deterministic program routing as non-model work instead of
